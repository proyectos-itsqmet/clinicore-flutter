name: clinicore_flutter
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Networking — cliente HTTP
  dio: ^5.11.0

  # Storage seguro
  flutter_secure_storage: ^10.3.1

  # State management
  flutter_bloc: ^9.1.1

  # Routing — navegación
  go_router: ^17.5.0

  # Dependency injection — service locator
  get_it: ^9.2.1

  # Dominio — errores funcionales
  dartz: ^0.10.1
  equatable: ^2.1.0

  # Auth — biometría
  local_auth: ^3.0.2

  # UI — skeletons, SVG, imágenes con caché
  flutter_svg: ^2.3.0
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1

  # Iconos
  phosphor_icons: ^3.0.1

  # Integración con el dispositivo — compartir, abrir URLs, info de la app
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

  # Config — variables de entorno
  flutter_dotenv: ^6.0.1

  # Utils — IDs únicos, formato/i18n
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
    - assets/
    - assets/images/

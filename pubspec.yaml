name: clinicore_flutter
description: "CliniCore — app movil de turnos, atencion y experiencia del cliente."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # i18n — localizaciones de Material/Cupertino en espanol.
  # Sin esto el date picker, los menus de seleccion de texto y los tooltips
  # nativos salen en ingles dentro de una app en espanol.
  flutter_localizations:
    sdk: flutter

  # Networking — cliente HTTP
  dio: ^5.11.0

  # Networking — realtime turn updates over STOMP/SockJS.
  # A plain WebSocket client (e.g. web_socket_channel) speaks frames only;
  # the backend's /ws-turns endpoint speaks STOMP on top of a SockJS
  # transport (WebSocketConfig.withSockJS()), so the client needs a package
  # that understands STOMP framing, not raw bytes. Pulls in `web_socket`
  # (the small official transport package) as its only runtime dependency.
  # See features/home/data/datasources/turn_updates_remote_data_source.dart.
  stomp_dart_client: ^3.0.1

  # Storage seguro
  flutter_secure_storage: ^10.3.1

  # State management
  flutter_bloc: ^9.1.1

  # Routing — navegación
  go_router: ^17.5.0

  # Dependency injection — service locator
  get_it: ^9.2.1

  # Dominio — errores funcionales
  dartz: ^0.10.1
  equatable: ^2.1.0

  # Auth — biometría
  local_auth: ^3.0.2

  # UI — skeletons, SVG, imágenes con caché
  flutter_svg: ^2.3.0
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1

  # Iconos
  phosphor_icons: ^3.0.1

  # Integración con el dispositivo — compartir, abrir URLs, info de la app
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

  # Config — variables de entorno
  flutter_dotenv: ^6.0.1

  # Utils — IDs únicos, formato/i18n
  uuid: ^4.6.0
  # ^0.20.2 y no ^0.20.3: flutter_localizations pinea intl 0.20.2 EXACTO,
  # asi que pedir 0.20.3 como minimo hace que el solver falle. El caret sigue
  # permitiendo cualquier 0.20.x, solo que el SDK gana.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
    - .env.app_prod
    - .env.app_dev
    - assets/
    - assets/images/

  # Tipografía — las dos familias del design system.
  #
  # Se declaran EXACTAMENTE los pesos que carga design/Mobile.dc.html
  # (`Figtree:wght@400;500;600;700` y `Nunito:wght@600;700;800`), no las
  # familias completas: cada .ttf extra pesa en el bundle y ningún token de
  # la escala tipográfica pide un peso fuera de esta lista.
  #
  # Sin cursivas: el sistema de diseño no usa itálica en ningún nivel.
  fonts:
    # --font-display: titulares (h1, h2, h3) y cifras tabulares (fig).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Nunito-ExtraBold.ttf
          weight: 800

    # --font-sans: todo el resto — lead, body, meta, cap, kicker.
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree/Figtree-Bold.ttf
          weight: 700
